services:
  - type: web
    name: rocket-space-simulator-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: FIREBASE_PROJECT_ID
        value: rocket-space-simulator
      - key: CORS_ORIGINS
        value: https://rocket-space-simulator.vercel.app,http://localhost:5173,http://127.0.0.1:5173
