<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="1280" height="720" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges">
  <title>Launch pad on Earth</title>
  <rect width="320" height="180" fill="#1a4d86"/>
  <rect y="22" width="320" height="28" fill="#2a6aaf"/>
  <rect y="50" width="320" height="22" fill="#4d94cc"/>

  <rect x="18" y="10" width="14" height="14" fill="#ffd56a"/>
  <rect x="20" y="8" width="10" height="2" fill="#ffe7a0"/>
  <rect x="16" y="12" width="2" height="10" fill="#ffe7a0"/>
  <rect x="32" y="12" width="2" height="10" fill="#ffe7a0"/>
  <rect x="20" y="24" width="10" height="2" fill="#ffe7a0"/>

  <g fill="#f4f8ff">
    <rect x="86" y="16" width="28" height="6"/>
    <rect x="92" y="12" width="16" height="4"/>
    <rect x="168" y="20" width="22" height="4"/>
    <rect x="236" y="14" width="30" height="6"/>
    <rect x="244" y="10" width="16" height="4"/>
  </g>

  <!-- sea, beach, then the field around the pad -->
  <rect y="72" width="320" height="8" fill="#2f7eae"/>
  <rect y="80" width="320" height="4" fill="#e6d3a4"/>
  <rect y="84" width="320" height="96" fill="#3c8a45"/>
  <rect y="150" width="36" height="30" fill="#2f7338"/>
  <rect x="286" y="148" width="34" height="32" fill="#2f7338"/>

  <!-- road from the building to the pad -->
  <rect x="156" y="108" width="36" height="72" fill="#8d918c"/>
  <rect x="160" y="108" width="4" height="72" fill="#c5c8c2"/>
  <rect x="184" y="108" width="4" height="72" fill="#6d716c"/>

  <!-- concrete pad. The rocket stands on the left half. -->
  <rect x="18" y="112" width="150" height="52" fill="#b7b6b0"/>
  <rect x="18" y="112" width="150" height="4" fill="#e4e2da"/>
  <rect x="18" y="160" width="150" height="4" fill="#8a8882"/>
  <rect x="62" y="124" width="40" height="28" fill="#6a6e72"/>
  <rect x="74" y="124" width="16" height="28" fill="#3e444c"/>
  <rect x="24" y="148" width="28" height="8" fill="#9a9c96"/>

  <!-- gantry beside the rocket -->
  <rect x="34" y="36" width="6" height="80" fill="#9aa3ad"/>
  <rect x="58" y="36" width="6" height="80" fill="#9aa3ad"/>
  <rect x="34" y="36" width="30" height="4" fill="#d5dbe2"/>
  <g fill="#6e7884">
    <rect x="34" y="48" width="30" height="3"/>
    <rect x="34" y="62" width="30" height="3"/>
    <rect x="34" y="76" width="30" height="3"/>
    <rect x="34" y="90" width="30" height="3"/>
    <rect x="34" y="104" width="30" height="3"/>
  </g>
  <rect x="28" y="32" width="8" height="6" fill="#e23b3b"/>
  <rect x="62" y="108" width="22" height="6" fill="#c5ccd4"/>

  <!-- vehicle assembly building -->
  <rect x="196" y="28" width="108" height="112" fill="#d7dde6"/>
  <rect x="196" y="28" width="108" height="6" fill="#f2f5f8"/>
  <rect x="296" y="28" width="8" height="112" fill="#8e97a6"/>
  <rect x="196" y="134" width="108" height="6" fill="#6d7686"/>
  <g fill="#c3cad4">
    <rect x="196" y="48" width="100" height="2"/>
    <rect x="196" y="66" width="100" height="2"/>
    <rect x="196" y="84" width="100" height="2"/>
    <rect x="196" y="102" width="100" height="2"/>
    <rect x="196" y="120" width="100" height="2"/>
  </g>
  <rect x="220" y="58" width="40" height="82" fill="#2c3444"/>
  <rect x="224" y="62" width="32" height="74" fill="#1b2230"/>
  <rect x="238" y="62" width="4" height="74" fill="#3d4658"/>
  <rect x="262" y="38" width="28" height="18" fill="#f4f7fb"/>
  <rect x="262" y="38" width="12" height="8" fill="#2a4f8f"/>
  <g fill="#d23b3b">
    <rect x="274" y="38" width="16" height="2"/>
    <rect x="262" y="46" width="28" height="2"/>
    <rect x="262" y="50" width="28" height="2"/>
    <rect x="262" y="54" width="28" height="2"/>
  </g>

  <rect x="4" y="96" width="24" height="18" fill="#e7e4dc"/>
  <rect x="4" y="96" width="24" height="3" fill="#c4553a"/>
  <rect x="8" y="102" width="5" height="6" fill="#7ec8f0"/>
  <rect x="16" y="102" width="5" height="6" fill="#7ec8f0"/>

  <rect x="8" y="88" width="2" height="12" fill="#6b4a2a"/>
  <rect x="2" y="84" width="14" height="4" fill="#1f6b34"/>
  <rect x="4" y="80" width="8" height="4" fill="#2f8a44"/>
  <rect x="304" y="92" width="2" height="14" fill="#6b4a2a"/>
  <rect x="298" y="88" width="14" height="4" fill="#1f6b34"/>
  <rect x="300" y="84" width="8" height="4" fill="#2f8a44"/>
</svg>
