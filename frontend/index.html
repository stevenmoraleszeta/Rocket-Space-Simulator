<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b1030" />
    <meta name="description" content="A space game for kids ages 8+, made with AI (SI) help." />
    <meta name="ai-assistance" content="Made with AI (SI) help: code, text, trailer, and audio." />
    <meta property="og:title" content="Rocket Space Simulator" />
    <meta property="og:description" content="A space game for kids ages 8+, made with AI (SI) help." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rocket Space Simulator</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("/fonts/press-start-2p-latin-400-normal.woff2") format("woff2");
        font-display: swap;
      }
      html { color-scheme: dark; background: #0b1030; }
      body { margin: 0; background: #0b1030; color: #fff; }
      .boot {
        min-height: 100svh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 115%, #24306e 0%, transparent 52%),
          radial-gradient(ellipse at 50% -15%, #3a4cb0 0%, #0b1030 58%);
        font-family: "Press Start 2P", "Trebuchet MS", monospace;
      }
      .boot__sky {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.5px 1.5px at 8% 18%, #fff 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 18% 72%, #b9c2ec 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 32% 28%, #fff 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 46% 84%, #fff 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 61% 16%, #b9c2ec 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 74% 62%, #fff 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 86% 34%, #fff 50%, transparent 52%),
          radial-gradient(1.5px 1.5px at 92% 78%, #b9c2ec 50%, transparent 52%);
        animation: boot-twinkle 1.6s steps(2, end) infinite;
      }
      .boot__card { position: relative; text-align: center; padding: 24px; }
      .boot__rocket {
        width: 112px;
        height: 112px;
        image-rendering: pixelated;
        animation: boot-bob 1.1s steps(2, end) infinite;
        filter: drop-shadow(4px 8px 0 #05061a);
      }
      .boot__title {
        margin: 18px 0 0;
        font-size: 13px;
        line-height: 1.7;
        text-shadow: 3px 3px 0 #1a2260;
      }
      .boot__title span { display: block; color: #4fc3ff; }
      .boot__status {
        margin: 18px 0 0;
        color: #ffd23f;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .boot__bar {
        width: 180px;
        height: 12px;
        margin: 14px auto 0;
        background: #12183f;
        box-shadow: inset 2px 2px 0 #05061a, inset -2px -2px 0 #2c3670;
        overflow: hidden;
      }
      .boot__bar span {
        display: block;
        width: 42%;
        height: 100%;
        background: linear-gradient(90deg, #ff6a1a, #ffd23f);
        animation: boot-fuel 1.15s steps(8, end) infinite;
      }
      @keyframes boot-bob { 50% { transform: translateY(-8px); } }
      @keyframes boot-fuel {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @keyframes boot-twinkle { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .boot__sky, .boot__rocket, .boot__bar span { animation: none; }
        .boot__bar span { width: 68%; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot__sky" aria-hidden="true"></div>
        <div class="boot__card">
          <img class="boot__rocket" src="/rocket-mark.svg" alt="" width="112" height="112" />
          <p class="boot__title">Rocket Space<span>Simulator</span></p>
          <p class="boot__status">Loading…</p>
          <div class="boot__bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var status = document.querySelector('.boot__status')
        if (!status) return
        try {
          var saved = JSON.parse(localStorage.getItem('space-mission:settings') || 'null')
          if (saved && saved.language === 'es') status.textContent = 'Cargando…'
        } catch (e) { /* keep the English line */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
